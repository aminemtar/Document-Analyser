name: documind_ai
description: A premium AI-powered document analysis app built with Flutter.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  file_picker: ^10.3.10
  shared_preferences: ^2.3.5
  path_provider: ^2.1.5
  http: ^1.3.0
  flutter_dotenv: ^5.2.1
  syncfusion_flutter_pdf: ^28.2.12
  archive: ^4.0.7
  xml: ^6.5.0
  flutter_local_notifications: ^22.0.1
  # Only used for TZDateTime (reminders are scheduled as UTC instants).
  timezone: ">=0.9.0 <1.0.0"
  # Scanning: take or pick photos, then read their text on the device.
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.15.0
  # Monetization: AdMob ads (with Google's consent form) and store billing.
  google_mobile_ads: ^9.2.0
  in_app_purchase: ^3.3.1
  # Share an analysis, export and restore a backup.
  share_plus: ^11.1.0
  # Render scanned PDF pages to images so they can be read by the scanner.
  pdfx: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#2147D8"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/icon/icon.png
